<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${consultant.id == null
            ? 'Add Consultant'
            : 'Edit Consultant'}">
        Consultant Form
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef8ff, #f8fbff);
            color: #16324f;
        }

        .top-navigation {
            background: #ffffff;
            border-bottom: 1px solid #d9ecf8;
            box-shadow: 0 4px 18px rgba(30, 100, 150, 0.08);
        }

        .brand-name {
            color: #1261a0;
            font-weight: 700;
        }

        .form-container {
            max-width: 850px;
            margin: 55px auto;
        }

        .form-card {
            background: #ffffff;
            border: 1px solid #d7eaf7;
            border-radius: 20px;
            box-shadow: 0 18px 45px rgba(31, 104, 151, 0.12);
            overflow: hidden;
        }

        .form-heading {
            padding: 30px 35px;
            background: linear-gradient(135deg, #0f75bc, #55b7e9);
            color: #ffffff;
        }

        .form-content {
            padding: 35px;
        }

        .form-label {
            font-weight: 600;
            color: #274c68;
        }

        .form-control,
        .form-select {
            min-height: 48px;
            border-radius: 10px;
            border: 1px solid #c8dfed;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #42a5d9;
            box-shadow: 0 0 0 4px rgba(66, 165, 217, 0.15);
        }

        .btn-primary {
            background: #147bb8;
            border-color: #147bb8;
            border-radius: 10px;
            padding: 11px 24px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #0c659b;
            border-color: #0c659b;
        }

        .btn-cancel {
            border-radius: 10px;
            padding: 11px 24px;
            font-weight: 600;
        }

        .field-error {
            color: #c62828;
            font-size: 0.875rem;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<nav class="top-navigation py-3">
    <div class="container d-flex justify-content-between align-items-center">

        <a class="brand-name text-decoration-none fs-4"
           th:href="@{/dashboard}">
            Consultant Management System
        </a>

        <a class="btn btn-outline-primary"
           th:href="@{/dashboard}">
            Dashboard
        </a>

    </div>
</nav>

<main class="container form-container">

    <div class="form-card">

        <div class="form-heading">

            <h1 class="h2 mb-2"
                th:text="${consultant.id == null
                    ? 'Add Consultant'
                    : 'Edit Consultant'}">
                Add Consultant
            </h1>

            <p class="mb-0">
                Enter the consultant’s professional information.
            </p>

        </div>

        <div class="form-content">

            <form th:action="@{/consultants/save}"
                  th:object="${consultant}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div class="row g-4">

                    <!-- Full Name -->
                    <div class="col-md-6">

                        <label class="form-label"
                               for="name">
                            Full Name
                        </label>

                        <input class="form-control"
                               id="name"
                               type="text"
                               th:field="*{name}"
                               placeholder="Example: Roshana Bhandari">

                        <div class="field-error"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">
                        </div>

                    </div>

                    <!-- Email -->
                    <div class="col-md-6">

                        <label class="form-label"
                               for="email">
                            Email Address
                        </label>

                        <input class="form-control"
                               id="email"
                               type="email"
                               th:field="*{email}"
                               placeholder="name@example.com">

                        <div class="field-error"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <!-- Phone -->
                    <div class="col-md-6">

                        <label class="form-label"
                               for="phone">
                            Phone Number
                        </label>

                        <input class="form-control"
                               id="phone"
                               type="text"
                               th:field="*{phone}"
                               placeholder="Example: 347-555-0182">

                        <div class="field-error"
                             th:if="${#fields.hasErrors('phone')}"
                             th:errors="*{phone}">
                        </div>

                    </div>

                    <!-- Technology -->
                    <div class="col-md-6">

                        <label class="form-label"
                               for="technology">
                            Primary Technology
                        </label>

                        <input class="form-control"
                               id="technology"
                               type="text"
                               th:field="*{technology}"
                               placeholder="Example: Java, Spring Boot">

                        <div class="field-error"
                             th:if="${#fields.hasErrors('technology')}"
                             th:errors="*{technology}">
                        </div>

                    </div>

                    <!-- Experience -->
                    <div class="col-md-6">

                        <label class="form-label"
                               for="experience">
                            Experience in Years
                        </label>

                        <input class="form-control"
                               id="experience"
                               type="number"
                               min="0"
                               max="50"
                               th:field="*{experience}"
                               placeholder="Example: 6">

                        <div class="field-error"
                             th:if="${#fields.hasErrors('experience')}"
                             th:errors="*{experience}">
                        </div>

                    </div>

                    <!-- Status -->
                    <div class="col-md-6">

                        <label class="form-label"
                               for="status">
                            Consultant Status
                        </label>

                        <select class="form-select"
                                id="status"
                                th:field="*{status}">

                            <option value="">
                                Select status
                            </option>

                            <option th:each="currentStatus : ${statuses}"
                                    th:value="${currentStatus}"
                                    th:text="${#strings.replace(
                                        currentStatus.name(),
                                        '_',
                                        ' '
                                    )}">
                            </option>

                        </select>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('status')}"
                             th:errors="*{status}">
                        </div>

                    </div>

                    <!-- Joined Date -->
                    <div class="col-md-6">

                        <label class="form-label"
                               for="joinedDate">
                            Joined Date
                        </label>

                        <input class="form-control"
                               id="joinedDate"
                               type="date"
                               th:field="*{joinedDate}"
                               required>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('joinedDate')}"
                             th:errors="*{joinedDate}">
                        </div>

                    </div>

                </div>

                <!-- Form Buttons -->
                <div class="d-flex justify-content-end gap-3 mt-5">

                    <a class="btn btn-outline-secondary btn-cancel"
                       th:href="@{/dashboard}">
                        Cancel
                    </a>

                    <button class="btn btn-primary"
                            type="submit">
                        Save Consultant
                    </button>

                </div>

            </form>

        </div>
    </div>

</main>

</body>
</html>
